<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users Dashboard</title>
  <style>
    /* General page styling */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f9fc;
      color: #2c3e50;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #34495e;
    }

    /* Input & Button styling */
    input {
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 5px;
      width: calc(33% - 10px);
      box-sizing: border-box;
    }

    button {
      padding: 8px 15px;
      font-size: 1rem;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #3498db;
      color: white;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    /* Lists */
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: #ecf0f1;
      margin: 5px 0;
      padding: 10px 15px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* Highlight new users */
    .highlight {
      background: #ffe066 !important;
      font-weight: bold;
    }

    /* Sections */
    .section {
      margin-bottom: 30px;
      padding: 15px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* Admin login section */
    #loginSection, #adminSection {
      margin-bottom: 20px;
    }

    #loginMessage {
      display: block;
      margin-top: 5px;
      color: red;
    }

    /* Delete buttons inside list items */
    li button {
      background-color: #e74c3c;
      margin-left: 10px;
    }

    li button:hover {
      background-color: #c0392b;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      input {
        width: 100%;
        margin-bottom: 5px;
      }

      button {
        width: 100%;
        margin-bottom: 5px;
      }

      li {
        flex-direction: column;
        align-items: flex-start;
      }

      li button {
        margin-top: 5px;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <h1>🚀 Users Dashboard</h1>

  <!-- Admin Login -->
  <div id="loginSection">
    <h2>🔐 Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Email" required />
    <input type="password" id="adminPassword" placeholder="Password" required />
    <button onclick="adminLogin()">Login</button>
    <span id="loginMessage"></span>
  </div>

  <!-- Admin Section -->
  <div id="adminSection" style="display:none;">
    <div class="section">
      <h2>🟢 New Users (last 30s)</h2>
      <ul id="newUserList"></ul>
    </div>

    <div class="section">
      <h2>All Users</h2>
      <ul id="userList"></ul>
    </div>

    <div class="section">
      <h2>Add User</h2>
      <input type="text" id="name" placeholder="Enter name" required />
      <input type="email" id="email" placeholder="Enter email" required />
      <input type="password" id="password" placeholder="Enter password" required />
      <button onclick="addUser()">Add User</button>
    </div>
  </div>

  <script>
    let adminToken = "";
    let previousNewIds = new Set();

    async function adminLogin() {
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value.trim();
      if (!email || !password) return;

      const res = await fetch("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      const msg = document.getElementById("loginMessage");

      if (data.success && data.is_admin) {
        adminToken = data.token;
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("adminSection").style.display = "block";
        msg.textContent = "";
        loadUsers();
      } else {
        msg.textContent = data.error || "Invalid admin credentials";
      }
    }

    async function loadUsers() {
      if (!adminToken) return;

      // Load all users
      const resAll = await fetch("/admin/users", { 
        headers: { "Authorization": "Bearer " + adminToken } 
      });
      const users = await resAll.json();
      const userList = document.getElementById("userList");
      userList.innerHTML = "";
      users.forEach(u => {
        const li = document.createElement("li");
        li.textContent = `${u.id}: ${u.name} (${u.email})`;

        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.onclick = () => deleteUser(u.id);

        li.appendChild(delBtn);
        userList.appendChild(li);
      });

      // Load new users (last 30 seconds)
      const resNew = await fetch("/admin/new-users", { 
        headers: { "Authorization": "Bearer " + adminToken } 
      });
      const newUsers = await resNew.json();
      const newUserList = document.getElementById("newUserList");
      newUserList.innerHTML = "";
      newUsers.forEach(u => {
        const li = document.createElement("li");
        li.textContent = `${u.id}: ${u.name}`;
        if (!previousNewIds.has(u.id)) li.classList.add("highlight");
        newUserList.appendChild(li);
      });

      previousNewIds = new Set(newUsers.map(u => u.id));
    }

    async function deleteUser(id) {
      if (!adminToken) return;
      await fetch(`/admin/user/${id}`, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + adminToken }
      });
      loadUsers();
    }

    async function addUser() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!name || !email || !password) return;

      await fetch("/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, password })
      });

      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      loadUsers();
    }

    // Refresh users every 5 seconds
    setInterval(loadUsers, 5000);
  </script>
</body>
</html>
